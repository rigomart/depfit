lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

catalogs:
  default:
    react:
      specifier: ^19.0.0
      version: 19.2.0

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.9.0
        version: 5.9.3

  apps/api:
    dependencies:
      hono:
        specifier: ^4.13.0
        version: 4.13.13
      zod:
        specifier: ^4.0.0
        version: 4.6.5

  apps/web:
    dependencies:
      '@fixture/api':
        specifier: workspace:*
        version: link:../api
      zod:
        specifier: ^4.0.0
        version: 4.6.5

  packages/ui:
    dependencies:
      react:
        specifier: 'catalog:'
        version: 19.2.0
      sonner:
        specifier: ^2.0.7
        version: 2.0.7(react@19.2.0)

packages:

  hono@4.13.13:
    resolution: {integrity: sha512-AAAA}
    engines: {node: '>=16.9.0'}

  react@19.2.0:
    resolution: {integrity: sha512-DDDD}
    engines: {node: '>=0.10.0'}

  sonner@2.0.7:
    resolution: {integrity: sha512-EEEE}
    peerDependencies:
      react: ^18.0.0 || ^19.0.0

  typescript@5.9.3:
    resolution: {integrity: sha512-BBBB}
    engines: {node: '>=14.17'}
    hasBin: true

  zod@4.6.5:
    resolution: {integrity: sha512-CCCC}

snapshots:

  hono@4.13.13: {}

  react@19.2.0: {}

  sonner@2.0.7(react@19.2.0):
    dependencies:
      react: 19.2.0

  typescript@5.9.3: {}

  zod@4.6.5: {}
