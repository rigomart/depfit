name: Set up depfit
description: Bun, Node, and the dependencies in bun.lock.
inputs:
  node-version:
    description: Node version. The Bun jobs need Node too, for the Vite build process depfit spawns.
    required: true
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - run: bun install --frozen-lockfile
      shell: bash
